version: '3.8'
services:
  mysql:
    image: mysql:8.4
    container_name: chain55-mysql
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    environment:
      MYSQL_DATABASE: capstone-1
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-}
    command: --skip-name-resolve

  rabbitmq:
    image: rabbitmq:3-management
    container_name: chain55-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

volumes:
  mysql-data:
